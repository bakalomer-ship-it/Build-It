<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2c3524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>בונים מחנאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/controls/OrbitControls.js": "./lib/OrbitControls.js" } }
</script>
</head>
<body>
<!--GAME-BODY-START-->
<div id="app">
  <canvas id="scene"></canvas>

  <header id="topbar">
    <div class="level-tag"><span class="lvl">שלב 1</span><span class="lvl-name">קלף 2×2</span></div>
    <nav id="stages" aria-label="שלבי בנייה"></nav>
    <div class="top-tools">
      <span id="timer" class="timer">0:00</span>
      <button id="btn-folder" class="tool" type="button" aria-label="תיק מבנה">תיק מבנה</button>
      <button id="btn-full" class="tool icon" type="button" aria-label="מסך מלא">⛶</button>
    </div>
  </header>

  <aside id="tray" class="side side-start">
    <div class="tray-title">מגש סנדות</div>
    <div id="tray-pole" class="tray-pole" role="button" aria-label="גררו סנדה לשרטוט">
      <div class="pole-graphic"></div>
      <span>סנדה</span>
      <small>גררו לשרטוט</small>
    </div>
    <div class="tray-count" id="tray-count"></div>
  </aside>

  <aside id="length-panel" class="side side-end" hidden>
    <div class="lp-name" id="lp-name">רגל</div>
    <div class="lp-scroll" id="lp-scroll" aria-label="גללו לשינוי האורך">
      <div class="lp-ticks" id="lp-ticks"></div>
      <div class="lp-value"><b id="lp-value">2.0</b><span>מ'</span></div>
    </div>
    <div class="lp-plan">בשרטוט: <b id="lp-plan">2.0</b> מ'</div>
    <div class="lp-row">
      <button type="button" class="tool" id="lp-minus" aria-label="קצר ב-10 ס&quot;מ">−</button>
      <button type="button" class="tool" id="lp-plus" aria-label="הארך ב-10 ס&quot;מ">+</button>
    </div>
    <button type="button" class="tool ghost" id="lp-remove">הסרת הסנדה</button>
  </aside>

  <aside id="rope-panel" class="side side-end" hidden>
    <div class="rp-title">חבל ההרמה</div>
    <div class="rp-pad" id="rp-pad" aria-label="החליקו למטה כדי למשוך">
      <div class="rp-rope" id="rp-rope"></div>
      <div class="rp-hint">משכו<br>למטה</div>
    </div>
    <div class="gauge">
      <div class="gauge-arc"><div class="gauge-needle" id="gauge-needle"></div></div>
      <div class="gauge-text"><b id="gauge-val">0°</b> <span id="gauge-label">שוכב</span></div>
    </div>
  </aside>

  <footer id="hint"><span id="hint-text"></span><div id="actions"></div></footer>

  <div id="picker" class="picker" hidden>
    <div class="picker-title" id="picker-title">בחרו כפיתה</div>
    <div class="picker-opts" id="picker-opts"></div>
    <button type="button" class="tool ghost" id="picker-untie" hidden>התרת הכפיתה</button>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="card" role="dialog" aria-modal="true">
      <div id="modal-body"></div>
      <div class="card-actions" id="modal-actions"></div>
    </div>
  </div>

  <div id="folder" class="modal" hidden>
    <div class="card folder-card" role="dialog" aria-modal="true">
      <div class="folder-head">
        <div><div class="eyebrow">תיק מבנה</div><h2>קלף 2×2</h2></div>
        <button type="button" class="tool" id="folder-close">סגירה</button>
      </div>
      <div class="folder-tabs" id="folder-tabs"></div>
      <div class="folder-body" id="folder-body"></div>
    </div>
  </div>

  <div id="rotate" class="rotate">
    <div class="rotate-phone"></div>
    <p>סובבו את הטלפון לרוחב</p>
  </div>
</div>
<!--GAME-BODY-END-->
<script type="module" src="src/main.js"></script>
</body>
</html>
