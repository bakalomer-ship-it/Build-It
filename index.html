<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2c3524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>בונים מחנאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js", "three/addons/controls/OrbitControls.js": "./lib/OrbitControls.js" } }
</script>
</head>
<body>
<!--GAME-BODY-START-->
<div id="app">
  <canvas id="scene"></canvas>

  <header id="topbar">
    <button type="button" id="btn-level" class="level-tag" title="בחירת שלב"><span class="lvl" id="level-no">שלב 1</span><span class="lvl-name" id="level-name">קלף 2×2</span></button>
    <button type="button" id="btn-home" class="tool home-btn" aria-label="מסך הבית" title="מסך הבית">⌂ בית</button>
    <nav id="stages" aria-label="שלבי בנייה"></nav>
    <div class="top-tools">
      <span id="timer" class="timer">0:00</span>
      <button id="btn-folder" class="tool" type="button" aria-label="תיק מבנה">תיק מבנה</button>
      <button id="btn-full" class="tool icon" type="button" aria-label="מסך מלא">⛶</button>
    </div>
  </header>

  <aside id="tray" class="side side-start">
    <div class="tray-title">ערימת סנדות</div>
    <div id="tray-pole" class="pile" aria-label="גררו סנדה מהערימה לשרטוט"></div>
    <div class="tray-count" id="tray-count"></div>
    <div class="rope-count" id="rope-count"></div>
  </aside>

  <aside id="length-panel" class="side side-end" hidden>
    <div class="lp-name" id="lp-name">רגל</div>
    <div class="lp-scroll" id="lp-scroll" aria-label="אורך הסנדה">
      <div class="lp-ticks" id="lp-ticks"></div>
      <div class="lp-value"><b id="lp-value">2.0</b><span>מ'</span></div>
    </div>
    <div class="lp-plan">בשרטוט: <b id="lp-plan">2.0</b> מ'</div>
    <div class="lp-fit" id="lp-fit"></div>
    <div class="lp-row" hidden>
      <button type="button" class="tool" id="lp-minus" aria-label="קצר ב-10 ס&quot;מ">−</button>
      <button type="button" class="tool" id="lp-plus" aria-label="הארך ב-10 ס&quot;מ">+</button>
    </div>
    <button type="button" class="tool ghost" id="lp-remove">החזרה לערימה</button>
  </aside>

  <aside id="rope-panel" class="side side-end" hidden>
    <div class="rp-title">חבל ההרמה</div>
    <div class="rp-pad" id="rp-pad" aria-label="החליקו למטה כדי למשוך">
      <div class="rp-rope" id="rp-rope"></div>
      <div class="rp-hint">משכו<br>למטה</div>
    </div>
    <div class="gauge">
      <div class="gauge-arc"><div class="gauge-needle" id="gauge-needle"></div></div>
      <div class="gauge-text"><b id="gauge-val">0°</b> <span id="gauge-label">שוכב</span></div>
    </div>
  </aside>

  <aside id="crew-panel" class="side side-start" hidden>
    <div class="tray-title">צוות ההרמה</div>
    <div class="crew-free" id="crew-free"></div>
    <div class="crew-list" id="crew-list"></div>
  </aside>

  <footer id="hint"><span id="hint-text"></span><div id="actions"></div></footer>

  <div id="picker" class="picker" hidden>
    <div class="picker-title" id="picker-title">בחרו כפיתה</div>
    <div class="picker-opts" id="picker-opts"></div>
    <button type="button" class="tool ghost" id="picker-untie" hidden>התרת הכפיתה</button>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="card" role="dialog" aria-modal="true">
      <div id="modal-body"></div>
      <div class="card-actions" id="modal-actions"></div>
    </div>
  </div>

  <div id="folder" class="modal" hidden>
    <div class="card folder-card" role="dialog" aria-modal="true">
      <div class="folder-head">
        <div><div class="eyebrow">תיק מבנה</div><h2>קלף 2×2</h2></div>
        <button type="button" class="tool" id="folder-close">סגירה</button>
      </div>
      <div class="folder-tabs" id="folder-tabs"></div>
      <div class="folder-body" id="folder-body"></div>
    </div>
  </div>

  <section id="home" class="screen" aria-label="מסך הבית">
    <header class="home-head">
      <div class="logo-knot" aria-hidden="true"><svg viewBox="0 0 30 30" fill="none" stroke-linecap="round"><path d="M8 27L22 3M22 27L8 3" stroke="#fff7e6" stroke-width="3.4"/><path d="M11 13.5l8 3M11 16.5l8-3M10.5 15h9" stroke="#3b2311" stroke-width="2"/></svg></div>
      <div><h1>בונים מחנאות</h1><p>כופתים סנדות, מרימים קלפים ובונים מבנים אמיתיים</p></div>
    </header>
    <div class="home-grid">
      <button type="button" class="home-main" id="home-plaza">
        <span class="hm-art"><svg viewBox="0 0 300 120" aria-hidden="true">
          <ellipse cx="150" cy="112" rx="160" ry="22" fill="#e2cfa4"/>
          <g stroke="#e2cfa4" stroke-width="1.5" opacity=".9"><path d="M20 104h260M45 96h210" stroke-dasharray="3 7"/></g>
          <g stroke-linecap="round">
            <path d="M68 108L104 22M140 108L104 22M104 22v86" stroke="#7f522d" stroke-width="6"/>
            <path d="M80 80h48" stroke="#9a683b" stroke-width="4.5"/>
            <circle cx="104" cy="29" r="5" fill="#c65a28"/>
            <path d="M166 108V30M232 108V30M158 38h82M158 96h82M166 96L232 38M166 38l66 58" stroke="#7f522d" stroke-width="6"/>
            <g fill="#c65a28"><circle cx="166" cy="38" r="4.5"/><circle cx="232" cy="38" r="4.5"/><circle cx="166" cy="96" r="4.5"/><circle cx="232" cy="96" r="4.5"/><circle cx="199" cy="67" r="4.5"/></g>
            <path d="M258 108V22" stroke="#553319" stroke-width="3.5"/>
            <path d="M258 24h26l-6 9 6 9h-26z" fill="#5a6e32"/>
          </g>
        </svg></span>
        <span class="hm-text">
          <span class="hm-eyebrow">המשחק המרכזי</span>
          <span class="hm-name">המגרש שלי</span>
          <span class="hm-sub">בונים מבנה אחרי מבנה על הרחבה האישית</span>
          <span class="hm-progress"><span class="hm-bar"><i id="home-bar"></i></span><span class="hm-stars" id="home-stars"></span></span>
        </span>
        <span class="hm-cta">לבנות ←</span>
      </button>
      <div class="home-side">
        <div class="home-feats">
        <button type="button" class="feat c-ember" id="home-challenges"><span class="ft-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 3h5M18.5 6.5l1.5-1.5"/></svg></span><span class="ft-txt"><b>אתגרים</b><small>נגד השעון ותיקון מחנה</small></span></button>
        <button type="button" class="feat c-olive" id="home-free"><span class="ft-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V3M18 21V3M3.5 6h17M3.5 17.5h17M6 17.5L18 6"/></svg></span><span class="ft-txt"><b>בנייה חופשית</b><small>ארגז חול: מתכננים קלף משלכם</small></span></button>
        <button type="button" class="feat c-blue" id="home-sketch"><span class="ft-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h8.5L19 7v14.5H6z"/><path d="M14.5 2.5V7H19M9 12h7M9 16h4.5"/></svg></span><span class="ft-txt"><b>בנייה לפי שרטוט</b><small>מעלים PDF או תמונה</small></span></button>
          <input type="file" id="sketch-file" accept="application/pdf,.pdf,image/*" hidden>
        <button type="button" class="feat c-wood" id="home-decor"><span class="ft-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21.5V3"/><path d="M6 4h11.5l-2.8 4 2.8 4H6"/></svg></span><span class="ft-txt"><b>קישוט המגרש</b><small>דגל השבט ופריטים בכוכבים</small></span></button>
        </div>
        <div class="home-soon"><span class="soon-lbl">בקרוב</span><span class="chipx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 20L12 4l9.5 16z"/><path d="M12 4v16M9.5 20l2.5-5 2.5 5"/></svg>ביקור אצל חברים</span><span class="chipx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5h8v5.5a4 4 0 0 1-8 0z"/><path d="M8 5.5H5a3 3 0 0 0 3 4.5M16 5.5h3a3 3 0 0 1-3 4.5M12 13v4M8.5 20.5h7"/></svg>תחרויות</span><span class="chipx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8.5" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M3 20c.5-4 2.6-6 5.5-6s5 2 5.5 6M14.5 14.2c3.3-.6 5.7 1.4 6.3 5.3"/></svg>בנייה בצוות</span></div>
      </div>
    </div>
  </section>

  <section id="levels" class="screen" aria-label="המגרש שלי" hidden>
    <div class="levels-head">
      <button type="button" class="tool" id="levels-back">חזרה</button>
      <div><div class="hm-eyebrow">המגרש שלי</div><h2>בחרו מבנה לבנות</h2></div>
      <span class="levels-total" id="levels-total"></span>
    </div>
    <div class="levels-path" id="levels-path"></div>
    <p class="levels-note">כוכב אחד במבנה פותח את המבנה הבא.</p>
  </section>

  <div id="rotate" class="rotate">
    <div class="rotate-phone"></div>
    <p>סובבו את הטלפון לרוחב</p>
  </div>
</div>
<!--GAME-BODY-END-->
<script type="module" src="src/main.js"></script>
</body>
</html>
